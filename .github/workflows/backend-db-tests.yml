name: Backend DB tests

on:
  push:
    branches: [main]
    paths:
      - "backend/supabase/**"
      - ".github/workflows/backend-db-tests.yml"
  pull_request:
    paths:
      - "backend/supabase/**"
      - ".github/workflows/backend-db-tests.yml"

jobs:
  db-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Spins up the full local stack (Postgres, Auth, Studio, ...) in Docker.
      # No hosted project connection and no secrets are needed for this job --
      # migrations and tests run entirely against the local stack.
      - name: Start local Supabase stack
        run: supabase start

      # Replays every migration under supabase/migrations/ from scratch, then
      # every seed file under supabase/seed/, against the local stack.
      - name: Apply migrations and seed data
        run: supabase db reset

      # Runs every pgTAP file under supabase/tests/database/.
      - name: Run database tests
        run: supabase test db

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop
