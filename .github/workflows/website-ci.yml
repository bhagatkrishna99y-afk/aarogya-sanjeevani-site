name: Website CI

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website-ci.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website-ci.yml"

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck + build
        run: npm run build

      - name: Unit/component tests
        run: npm run test

      # Playwright's browser *binaries* (Chromium/Firefox/WebKit, ~400MB+
      # combined) are a separate download from npm's own deps above --
      # setup-node's `cache: npm` doesn't touch them at all. Cached by OS +
      # the exact @playwright/test version, since a version bump can ship
      # browser builds the old cache entry wouldn't have.
      - name: Get installed Playwright version
        id: playwright-version
        run: |
          echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright's browsers (Chromium, Firefox, WebKit)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      # On a cache hit the browser binaries themselves are already there,
      # but the OS-level shared libraries they need (--with-deps) are a
      # separate apt-level install this runner may not have -- cheap to
      # redo every run, unlike the multi-hundred-MB browser download.
      - name: Install Playwright's OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit

      - name: Check for broken links
        run: npm run check:links

      - name: E2E tests (Chromium, Firefox, WebKit; mobile + desktop viewports)
        run: npm run test:e2e

      - name: Lighthouse CI (Performance/Accessibility/Best Practices/SEO >= 90, mobile)
        run: npm run lhci
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: website/playwright-report/
          retention-days: 14
