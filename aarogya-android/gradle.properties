# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# Kotlin
kotlin.code.style=official

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Compose compiler metrics/reports -- off by default (adds build time),
# flip to true locally when you need to inspect stability/recomposition
# reports under build/compose_metrics and build/compose_reports.
aarogya.enableComposeCompilerReports=false

# Versioning -- read by AndroidApplicationConventionPlugin.kt into both
# apps' defaultConfig (one versioning scheme shared by app-patient and
# app-doctor, bumped together here rather than per-module). versionName
# is the human-readable semver string shown to users/Play Console;
# versionCode is the integer Play Store ordering actually depends on and
# must strictly increase on every release uploaded there, pre-release
# builds included -- bump both together, never just one, and never
# decrease versionCode once a build carrying it has been uploaded
# anywhere, even to internal testing.
aarogya.versionCode=1
aarogya.versionName=1.0.0-rc1
